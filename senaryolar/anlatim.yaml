# Her senaryonun NE OLCTUGU - tek cumleyle, arastirma niyeti.
#
# Bu, senaryo ozetinin turetilemeyen tek bilesenidir. "Ne degistirildi",
# "ne sabit kaldi", "beklenen etki", "ne gozlendi" ve "kanit gucu" alanlarinin
# hepsi konfig dosyalarindan ve olcumlerden hesaplanir
# (teshis/degerlendirme/senaryo_ozeti.py). Arastirma niyeti ise hicbir veri
# dosyasinda yazmaz; buraya yazilir.
#
# Kural: duz, iddiasiz, arastirma dili. Sonucu degil SORUYU anlatir.
# Metinler ARAYUZDE gorunur, bu yuzden duzgun Turkce yazilir; yorumlar
# (bu satirlar) ASCII kalabilir.
#
# DIKKAT: bu dosyada bir anahtar iki kez yazilirsa YAML sessizce sonuncuyu
# alir. E3 bir donem iki kez tanimliydi ve ilk tanim hic gorunmuyordu;
# tests/test_anlatim.py bunu artik yasakliyor.

D1: >
  Bir sınıfın eğitimdeki temsil payı düşürülünce, kaybın yalnızca o sınıfta
  mı yoksa genel metriklerde de mi görüneceğini ölçer.

D2a: >
  Etiket kutuları kaydırıldığında (lokalizasyon gürültüsü), bozulmanın
  precision'da mı recall'da mı yoksa ikisinde birden mi görüneceğini ölçer.

D2b: >
  Eğitim etiketlerinin bir bölümü silindiğinde modelin ne yaptığını ölçer:
  etiketsiz kalan gerçek nesneleri arka plan olarak öğrenip öğrenmediğini.

D3: >
  Birbirine benzeyen iki az örnekli sınıf (UAP/UAI) karıştırıldığında,
  karışıklığın sınıf bazlı metriklerde görünür olup olmadığını ölçer.

D3b: >
  Aynı sınıf karışıklığı bol örnekli sınıflarda (taşıt/insan) uygulandığında
  modelin bozulmayı soğurup soğuramadığını ölçer.

D4: >
  Eğitimden küçük nesne sinyali silindiğinde, kaybın toplam metriklerde
  görünür olup olmadığını ölçer.

D5: >
  Eğitim verisinin kaynak dağılımı kaydırıldığında, bozulmanın hangi kaynak
  grubunda ve hangi checkpoint'te görüneceğini ölçer.

D6a: >
  Train ve validation kümeleri arasında sızıntı olduğunda ölçümün ne kadar
  iyimser hale geldiğini ölçer. Aynı ağırlıklar iki farklı küme üzerinde
  değerlendirildiği için fark tamamen kümenin etkisidir.

D6b: >
  Bir avuç kare aşırı temsil edildiğinde, temsil payı ile sınıf performansı
  arasında bir ilişki oluşup oluşmadığını ölçer.

E1: >
  Az veriyle çok epoch ve augmentasyonsuz eğitim yapıldığında oluşan aşırı
  uyumun, standart raporlamada (en iyi checkpoint) görünür olup olmadığını
  ölçer.

E2: >
  Epoch sayısı çok düşürüldüğünde yetersiz eğitim oluşup oluşmadığını ölçer.

# E3 iraksadigi icin degerlendirilemedi; defterde satiri yoktur.
# Bulgusu docs/BULGULAR.md "E3 Sonucu" bolumunde durur.
E3: >
  Öğrenme oranı 100 kat yüksek seçildiğinde eğitimin kararsızlaşıp
  kararsızlaşmadığını ölçer. ÖLÇÜLEMEDİ: eğitim epoch 1'de ıraksadı
  (bütün kayıplar nan), değerlendirilebilir bir model üretilmedi.

E3b: >
  Öğrenme oranı 10 kat yüksek seçildiğinde eğitimin kararsızlaşıp
  kararsızlaşmadığını ölçer. E3'te 100 kat tam ıraksama ürettiği ve hiçbir
  şey öğrenilmediği için kararsızlık gözlenemedi; bu senaryo ölçülebilir
  bandı arar.

E4: >
  Model eğitildiğinden farklı bir çözünürlükte çalıştırıldığında kaybın
  precision'da mı recall'da mı oluştuğunu ölçer. Ağırlıklar v00 ile aynıdır;
  değişen tek şey çıkarım çözünürlüğüdür.

Baseline: >
  Dağıtımdaki modelin (main_model.pt) hiç fine-tune edilmeden ölçülmüş hâli.
  Senaryolarla aynı protokolde EĞİTİLMEDİĞİ için bozulma karşılaştırmasında
  taban olarak kullanılmaz; onun yerine v00 kullanılır. Buradaki işlevi,
  fine-tune'un kendi etkisini görünür kılmak.

# Kontrol kosullari - bozulma icermez.
C2: >
  Hiçbir şey bozulmadan yalnızca rastgelelik tohumu değiştirildiğinde
  metriklerin ne kadar oynadığını ölçer. Bütün "etki" iddialarının altında
  duran gürültü tabanını verir. Kendisi bir bulgu olarak derecelendirilmez;
  ölçüm aracıdır, ölçüm nesnesi değil.

v00_saglikli: >
  Senaryolarla birebir aynı protokolde, temiz veriyle eğitilmiş sağlıklı
  referans. Ana ölçeğin (main_model.pt, val_diagnostic, 768 px, best.pt)
  tabanı budur.

v00n: >
  Farklı bir taban modelin (yolo26n) temiz veriyle eğitilmiş hâli; kendi
  ölçeğinin referansıdır ve v00 ile karşılaştırılmaz.

D1n: >
  D1 bozulmasının farklı bir taban model (yolo26n) üzerindeki etkisi;
  v00 ile değil v00n ile karşılaştırılır.
