version: 1
kurallar:
  saglikli_veri: v00_saglikli
  test_kullanimi: final_asamasina_kadar_yasak
  seed: 42
  manifest_ajana_verilmez: true

# gorunen_ad: arayuzde gosterilen insan dilindeki ad. Kod ("D4") tek basina
# izleyiciye bir sey soylemiyor; senaryo katalogunda baskin olan bu ad olmali.
# aile: senaryo keşif filtresi. `tur` (veri/egitim) egitim protokolu icin
# anlamli bir ayrim ama kullanici icin cok kaba - D5'in alan kaymasi ile
# D2b'nin eksik etiketi ayni kutuya dusuyordu.
senaryolar:
  - kod: D1
    ad: sinif_yetersizligi
    gorunen_ad: Sınıf yetersizliği
    aile: veri_etiket
    tur: veri
    config: veri/d1_sinif_yetersizligi.yaml
  - kod: D2a
    ad: lokalizasyon_gurultusu
    gorunen_ad: Lokalizasyon gürültüsü
    aile: veri_etiket
    tur: veri
    config: veri/d2a_lokalizasyon_gurultusu.yaml
  - kod: D2b
    ad: eksik_etiket
    gorunen_ad: Eksik etiket
    aile: veri_etiket
    tur: veri
    config: veri/d2b_eksik_etiket.yaml
  - kod: D3
    ad: uap_uai_sinif_karisikligi
    gorunen_ad: Nadir sınıf karışıklığı
    aile: veri_etiket
    tur: veri
    config: veri/d3_uap_uai_karisikligi.yaml
  - kod: D3b
    ad: tasit_insan_sinif_karisikligi
    gorunen_ad: Ana sınıf karışıklığı
    aile: veri_etiket
    tur: veri
    config: veri/d3b_tasit_insan_karisikligi.yaml
  - kod: D4
    ad: kucuk_nesne_sinyal_kaybi
    gorunen_ad: Küçük nesne sinyal kaybı
    aile: veri_etiket
    tur: veri
    config: veri/d4_kucuk_nesne_sinyal_kaybi.yaml
  - kod: D5
    ad: kaynak_alani_kaymasi
    gorunen_ad: Kaynak/alan kayması
    aile: dagilim
    tur: veri
    config: veri/d5_kaynak_alani_kaymasi.yaml
  - kod: D6a
    ad: split_sizintisi
    gorunen_ad: Değerlendirme sızıntısı
    aile: dagilim
    tur: veri
    config: veri/d6a_split_sizintisi.yaml
  - kod: D6b
    ad: tekrar_agirligi
    gorunen_ad: Tekrar ağırlığı
    aile: dagilim
    tur: veri
    config: veri/d6b_tekrar_agirligi.yaml
  - kod: E1
    ad: overfitting
    gorunen_ad: Aşırı uyum
    aile: egitim
    tur: egitim
    config: egitim/e1_overfitting.yaml
  - kod: E2
    ad: underfitting
    gorunen_ad: Yetersiz eğitim
    aile: egitim
    tur: egitim
    config: egitim/e2_underfitting.yaml
  - kod: E3
    ad: egitim_kararsizligi
    gorunen_ad: Aşırı öğrenme oranı (ıraksama)
    aile: egitim
    tur: egitim
    config: egitim/e3_egitim_kararsizligi.yaml
  - kod: E3b
    ad: egitim_kararsizligi_olculebilir
    gorunen_ad: Ölçülebilir yüksek öğrenme oranı
    aile: egitim
    tur: egitim
    config: egitim/e3b_egitim_kararsizligi_olculebilir.yaml
  - kod: E4
    ad: egitim_cikarsam_cozunurluk_uyumsuzlugu
    gorunen_ad: Çıkarım çözünürlüğü uyumsuzluğu
    aile: cikarim
    tur: egitim
    config: egitim/e4_cozunurluk_uyumsuzlugu.yaml
