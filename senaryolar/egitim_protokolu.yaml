version: 1
aciklama: >
  D serisi veri bozulma senaryolarinin (D1, D2a, D2b, D3, ...) birbiriyle
  karsilastirilabilir olmasi icin tum kosularda ayni optimizasyon ve
  augmentasyon protokolu kullanilir. Senaryolar arasinda yalnizca veri
  surumu (ve gerekiyorsa baslangic modeli) degisir; asagidaki degerler
  sabit kalir. Bu dosya teshis/egitim/protokol.py, teshis/egitim/kos.py,
  scripts/senaryo_*.py ve scripts/kaggle_*.py tarafindan tek kaynak olarak
  okunur.

sabit:
  # ---------------------------------------------------------------------
  # DIKKAT: optimizer 'auto' oldugu surece lr0 ve momentum BAGLAYICI DEGIL.
  #
  # Ultralytics, optimizer=auto iken bu iki degeri yok sayar ve kendisi
  # secer. E1 kosusunun log'unda birebir soyle gorunur:
  #
  #   optimizer: 'optimizer=auto' found, ignoring 'lr0=0.001' and
  #   'momentum=0.937' and determining best 'optimizer', 'lr0' and
  #   'momentum' automatically... AdamW(lr=0.00125, momentum=0.9)
  #
  # Yani asagidaki lr0 degeri bugune kadar HIC UYGULANMADI; tum D serisi
  # kosulari AdamW(lr=0.00125) ile egitildi. Kosularin BIRBIRIYLE
  # karsilastirilabilirligi bozulmaz - hepsi ayni auto secimini aldi - ama
  # beyan edilen deger gercegi yansitmiyordu.
  #
  # 'auto' bilerek korunuyor: acik bir optimizer yazmak lr0'i baglayici
  # hale getirir ve yeni kosulari mevcut D serisiyle karsilastirilamaz
  # kilar. Ogrenme oranini GERCEKTEN degistirmesi gereken bir senaryo
  # (orn. E3) sapmasinda optimizer'i da acikca belirtmek ZORUNDADIR;
  # test_e_serisi_protokolu.py bunu denetler.
  # ---------------------------------------------------------------------
  optimizer: auto
  deterministic: true
  cos_lr: true
  patience: 10
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 3
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.15
  degrees: 5.0
  translate: 0.08
  scale: 0.3
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.5
  close_mosaic: 8
  mixup: 0.0
  copy_paste: 0.0

bilinen_sapmalar:
  - kosu: experiments/run_20260817_222323_D1_42
    senaryo: D1
    sapan_alanlar: {lr0: 0.0005, warmup_epochs: 2}
    durum: duzeltilmedi_yeniden_kosu_onerilir
    not: >
      Bu D1 kosusu bu protokol dosyasi olusturulmadan once, teshis/egitim/kos.py
      icindeki farkli lr0/warmup_epochs degerleriyle uretildi. results.csv ve
      README'deki D1 sonuc tablosu bu kosuya aittir. D2a/D2b/D3 ile dogrudan
      lr0/warmup farkindan bagimsiz bir karsilastirma icin D1'in bu sabit
      protokolle yeniden kosulmasi (ve raporun guncellenmesi) gerekir.

kapsam_disi:
  - dosya: teshis/egitim/v3_iyilestirme.py
    neden: >
      D serisi tanı senaryosu degildir; ayri bir genel iyilestirme fine-tune
      denemesidir (farkli mosaic/close_mosaic/patience kasitli olarak
      kullanilir). Bu protokolun kapsaminda degildir.

# ---------------------------------------------------------------------------
# E SERISI: EGITIM ARIZALARI
#
# D serisi VERIYI bozar, protokolu sabit tutar. E serisi tam tersini yapar:
# veri temizdir (v00_saglikli), bozulan EGITIM PROTOKOLUDUR. Bu yuzden
# yukaridaki "sabit" bloktan kasitli olarak sapilir.
#
# Sapmalar burada BEYAN EDILIR; kod icine dagilmis CLI bayraklariyla degil.
# Boylece hangi kosunun protokolden nerede ve neden ayrildigi tek yerden
# okunabilir ve denetlenebilir.
#
# ONEMLI: E kosulari D kosulariyla ayni tabloda karsilastirilamaz. Fark
# bozulmadan degil, farkli egitim ayarindan gelir. Her E kosusu kendi
# saglikli referansiyla (ayni sapmalar HARIC ayni ayarlar) okunur.
# ---------------------------------------------------------------------------
e_serisi:
  E1:
    aciklama: >
      Overfitting. Az kare (1000), cok epoch (200), augmentasyon tamamen
      kapali. Beklenen: train metrikleri yukselirken val geride kalir ve
      aradaki fark acilir.
    sapmalar:
      hsv_v: 0.0
      degrees: 0.0
      translate: 0.0
      scale: 0.0
      fliplr: 0.0
      mosaic: 0.0
      close_mosaic: 0
      patience: 1000      # erken durdurma kapali; overfitting'in olusmasi gerekiyor
    kosu_ayarlari:
      epochs: 200
      kare_sayisi: 1000

  E2:
    aciklama: >
      Underfitting. Protokol ayarlari korunur, yalnizca epoch sayisi cok
      dusuktur. Beklenen: train ve val birlikte dusuk, loss hala inis
      egiliminde.
    sapmalar:
      patience: 1000      # 5 epoch'ta erken durdurma anlamsiz
    kosu_ayarlari:
      epochs: 5

  E3:
    aciklama: >
      Egitim kararsizligi. Ogrenme orani 100 kat yuksek. Beklenen: loss
      gurultulu, iki farkli seed arasinda belirgin oynaklik.
    sapmalar:
      # optimizer acikca yazilmali: 'auto' iken Ultralytics lr0'i yok sayar
      # ve E3 sessizce saglikli bir kosuya donusurdu. AdamW secildi cunku
      # auto'nun kendi secimi de AdamW'dir; boylece tek degisen ogrenme
      # oranidir (0.00125 -> 0.10, ~80 kat).
      optimizer: AdamW
      lr0: 0.10
      warmup_epochs: 0    # yuksek lr'nin etkisi warmup ile yumusatilmasin
    kosu_ayarlari:
      epochs: 30
      ikinci_seed: 43     # oynakligi olcmek icin ikinci kosu zorunlu

  E4:
    aciklama: >
      Egitim/cikarim cozunurluk uyumsuzlugu. Egitim protokolu bozulmaz;
      bozulma DEGERLENDIRME tarafindadir, model egitildigi cozunurlukten
      farkli bir imgsz ile olculur. Bu yuzden yeni egitim gerektirmez.
    sapmalar: {}
    kosu_ayarlari:
      egitim_imgsz: 768   # mevcut v00 referansi
      olcum_imgsz: [512, 640, 768, 1024, 1280]
