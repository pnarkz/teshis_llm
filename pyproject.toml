[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termal-teshis"
version = "0.1.0"
description = "Termal YOLO veri ve model teshis altyapisi"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["teshis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
