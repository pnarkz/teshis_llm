[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termal-teshis"
version = "0.1.0"
description = "Termal YOLO veri ve model teshis altyapisi"
requires-python = ">=3.10"
# Cekirdek analiz katmani (teshis/) yalnizca bunlara baglidir; egitim ve demo
# ayri ekstralardir. Boylece "pip install -e ." bir sunum makinesinde
# Ultralytics/CUDA indirmez.
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
demo = ["streamlit>=1.49", "altair>=5.0"]
live-agent = ["google-genai>=1.0"]
egitim = ["ultralytics>=8.3", "torch>=2.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["teshis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
