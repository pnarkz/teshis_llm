# Konsol sunumda kullanilacak; gorunumu izleyicinin isletim sistemi temasina
# birakmak riskli - tema SABITLENIR.
#
# Once acik tema sabitlenmisti (koyu temada metin renkleri CSS ile catisiyor
# ve icerik gorunmez oluyordu). Konsol koyu lacivert bir teknik panele
# donusturuldugunde tema burada da koyuya cevrildi; renkler stil.py'deki
# sozlesmeyle BIREBIR ayni tutulur, yoksa Streamlit'in kendi bilesenleri
# (secici, sekme, tablo) sayfadan ayrisir.
[theme]
base = "dark"
primaryColor = "#4c8dff"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131c2e"
textColor = "#e8ecf4"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
